spring.application.name=simple-spring-app
server.port=8080
app.name=Bookshelf
app.version=1.0.0
app.max-page-size=50

#hibernate
#spring.datasource.url=jdbc:h2:file:./data/bookdb
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.h2.console.enabled=true
#redis
spring.datasource.url=jdbc:postgresql://localhost:5432/bookshelf
spring.datasource.username=bookshelf
spring.datasource.password=bookshelf
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#cache (caffine)
#spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

#cache(redis)
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
#kafka producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#kafka consumer
spring.kafka.consumer.group-id=bookshelf-cache
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.simpleapp.event.BookEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.simpleapp.event

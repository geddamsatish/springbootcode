services:
    postgres:
      image: postgres:16
      container_name: bookshelf-postgres
      command: ["postgres", "-c", "wal_level=logical"]
      environment:
        POSTGRES_DB: bookshelf
        POSTGRES_USER: bookshelf
        POSTGRES_PASSWORD: bookshelf
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/posgresql/data
    redis:
      image: redis:7
      container_name: bookshelf-redis
      ports:
        - "6379:6379"
    connect:
      image: quay.io/debezium/connect:2.7
      container_name: bookshelf-connect
      depends_on:
        - kafka
        - postgres
      ports:
        - "8083:8083"
      environment:
        BOOTSTRAP_SERVERS: kafka:29092
        GROUP_ID: bookshelf-connect
        CONFIG_STORAGE_TOPIC: connect_configs
        OFFSET_STORAGE_TOPIC: connect_offsets
        STATUS_STORAGE_TOPIC: connect_statuses
        CONFIG_STORAGE_REPLICATION_FACTOR: 1
        OFFSET_STORAGE_REPLICATION_FACTOR: 1
        STATUS_STORAGE_REPLICATION_FACTOR: 1
    kafka:
      image: apache/kafka:3.9.0
      container_name: bookshelf-kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
volumes:
  pgdata:
